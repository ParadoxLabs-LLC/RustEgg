name: Build image

# Every client server pulls :latest, so the image is only published after a real
# server has booted with it on every framework.
# Manual only: run it from the Actions tab -> this workflow -> Run workflow.
# Rollback: run it with "rollback_to" set to an earlier commit SHA. Nothing is built: :latest is pointed back at the
# image published for that commit (every publish also pushes :<sha>), and servers get it on their next restart.
on:
  workflow_dispatch:
    inputs:
      rollback_to:
        description: 'Rollback: full commit SHA of an earlier published image (leave empty to build and publish)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  rollback:
    if: ${{ inputs.rollback_to != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :latest at the earlier image
        env:
          SHA: ${{ inputs.rollback_to }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "rollback_to must be a full 40-character commit SHA"; exit 1; }
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools inspect "$IMAGE:$SHA" >/dev/null || { echo "No published image $IMAGE:$SHA"; exit 1; }
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$SHA"
          echo "$IMAGE:latest now points at $SHA. Restart servers to pick it up."

  boot:
    if: ${{ inputs.rollback_to == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vanilla-public
            # -logfile passed on purpose, the way a Pine-style egg does: it must not double the console.
            vars: FRAMEWORK=vanilla BRANCH=public "ADDITIONAL_ARGS=-logfile logs/pine-style.log"
          - name: oxide-public
            vars: FRAMEWORK=oxide BRANCH=public DISCORD_EXT=1 RUSTEDIT_EXT=1 CHAOS_EXT=1 LOG_FILE=1
          - name: carbon-staging
            vars: FRAMEWORK=carbon BRANCH=staging DISCORD_EXT=1 RUSTEDIT_EXT=1
    name: boot (${{ matrix.name }})
    steps:
      - name: Free disk space for the Rust download
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rustegg:test .
      - name: Boot server
        env:
          TEST_NAME: ${{ matrix.name }}
        run: bash tests/run-server.sh rustegg:test ${{ matrix.vars }}
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.name }}
          path: .test-server/server.log
          if-no-files-found: ignore

  publish:
    needs: boot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
